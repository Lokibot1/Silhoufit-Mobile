appId: ${APP_ID}
---
# The Cart (opened from the Shop's cart button) is the one screen that needs a session; Shop stays public.
- runFlow: subflows/launch.yaml
- tapOn:
    id: shop-cart
- extendedWaitUntil:
    visible:
      id: cart-sign-in
    timeout: 10000
- assertVisible: Sign in to see your cart
- assertVisible: Your bag is saved to your account once you sign in.
- assertNotVisible:
    id: cart-list
