appId: ${APP_ID}
---
# The Google button and divider sit BELOW Sign In and do not affect the email/password form: password sign-in still succeeds.
# sign-in-divider is hidden from accessibility (it may be absent from the Maestro hierarchy): the divider asserts are optional,
# the order check on sign-in-google below sign-in-submit is the one that must pass.
- runFlow: subflows/launch.yaml
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-sign-in
- extendedWaitUntil:
    visible:
      id: sign-in-submit
    timeout: 10000
- assertVisible:
    id: sign-in-google
    below:
      id: sign-in-submit
- assertVisible:
    id: sign-in-divider
    below:
      id: sign-in-submit
    optional: true
- assertVisible:
    id: sign-in-divider
    above:
      id: sign-in-google
    optional: true
- tapOn:
    id: sign-in-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: profile-name
    timeout: 15000
- assertNotVisible:
    id: sign-in-banner
- assertNotVisible:
    id: sign-in-google
