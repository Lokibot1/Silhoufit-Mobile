appId: ${APP_ID}
---
# The Shop's top bar is a Paper band holding the search field, the cart button and the messages button; the tab header is hidden on the Shop only.
# The other tabs show their screen title in that header, which carries header-messages (the Shop has its own shop-messages instead); the Wishlist header also carries header-cart.
# Needs only the backend (signed out).
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: shop-search
    timeout: 15000
- assertVisible:
    id: shop-cart
- assertVisible:
    id: shop-messages
- extendedWaitUntil:
    visible:
      id: shop-list
    timeout: 15000
- assertNotVisible:
    id: header-messages
# Tab switches shift: wait for each screen instead of asserting right after the tap.
- tapOn:
    id: tab-wishlist
- extendedWaitUntil:
    visible:
      id: wishlist-sign-in
    timeout: 10000
# The other tabs show their title in the header, with its messages button; the Wishlist adds the cart button.
- extendedWaitUntil:
    visible: Wishlist
    timeout: 10000
- assertVisible:
    id: header-messages
- assertVisible:
    id: header-cart
- assertNotVisible:
    id: shop-search
- assertNotVisible:
    id: shop-messages
- tapOn:
    id: tab-shop
- extendedWaitUntil:
    visible:
      id: shop-search
    timeout: 10000
- assertVisible:
    id: shop-cart
- assertVisible:
    id: shop-messages
- extendedWaitUntil:
    visible:
      id: shop-list
    timeout: 15000
- assertNotVisible:
    id: header-messages
- assertNotVisible:
    id: header-cart
- assertNotVisible:
    id: wishlist-sign-in
