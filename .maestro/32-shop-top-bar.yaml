appId: ${APP_ID}
---
# The Shop's top bar is a Paper band holding the search field, the cart button and the messages button; the tab header (KRAL logo) is hidden on the Shop only.
# The other tabs keep the logo header, which carries header-messages (the Shop has its own shop-messages instead).
# The logo (src/ui/KralLogo.tsx) has no testID: it is an image with accessibilityLabel "KRAL", matched by that text (full-string regex).
# The intro loader's label is "Loading KRAL", which this exact match never hits. Needs only the backend (signed out).
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: shop-search
    timeout: 15000
- assertVisible:
    id: shop-cart
- assertVisible:
    id: shop-messages
- extendedWaitUntil:
    visible:
      id: shop-list
    timeout: 15000
- assertNotVisible: KRAL
- assertNotVisible:
    id: header-messages
# Tab switches shift: wait for each screen instead of asserting right after the tap.
- tapOn:
    id: tab-cart
- extendedWaitUntil:
    visible:
      id: cart-sign-in
    timeout: 10000
# The other tabs keep the logo header, with its messages button.
- extendedWaitUntil:
    visible: KRAL
    timeout: 10000
- assertVisible:
    id: header-messages
- assertNotVisible:
    id: shop-search
- assertNotVisible:
    id: shop-messages
- tapOn:
    id: tab-shop
- extendedWaitUntil:
    visible:
      id: shop-search
    timeout: 10000
- assertVisible:
    id: shop-cart
- assertVisible:
    id: shop-messages
- extendedWaitUntil:
    visible:
      id: shop-list
    timeout: 15000
- assertNotVisible: KRAL
- assertNotVisible:
    id: header-messages
- assertNotVisible:
    id: cart-sign-in
