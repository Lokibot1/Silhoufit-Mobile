# Reusable: from the launched app, sign in with the seeded customer via the Profile tab.
appId: ${APP_ID}
---
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-sign-in
# The sign-in screen slides up: wait for it to settle before typing
- extendedWaitUntil:
    visible:
      id: sign-in-submit
    timeout: 10000
- tapOn:
    id: sign-in-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: profile-name
    timeout: 15000
