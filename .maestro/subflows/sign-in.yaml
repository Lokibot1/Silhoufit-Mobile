# Reusable: from the signed-out Shop, sign in with the seeded customer.
appId: ${APP_ID}
---
- tapOn:
    id: shop-sign-in
- tapOn:
    id: sign-in-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: shop-profile-name
    timeout: 15000
