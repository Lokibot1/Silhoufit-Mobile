appId: ${APP_ID}
---
# Needs a seeded customer and an in-stock product (first Shop card). WRITES DATA: one piece stays in the cart of TEST_EMAIL
# (run flow 17 afterwards, it empties the bag). Tapping a cart item (image or name) opens that product's page.
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- tapOn:
    id: tab-shop
- extendedWaitUntil:
    visible:
      id: 'shop-card-(?!.*-image$).+'
    timeout: 15000
- tapOn:
    id: 'shop-card-(?!.*-image$).+'
- extendedWaitUntil:
    visible:
      id: product-name
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'product-swatch-.+'
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    id: 'product-swatch-.+'
    enabled: true
    optional: true
- scrollUntilVisible:
    element:
      id: 'product-size-.+'
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    id: 'product-size-.+'
    enabled: true
    optional: true
- tapOn:
    id: product-add-to-cart
- extendedWaitUntil:
    visible: Added to cart
    timeout: 10000
# The product page is a root Stack screen above the tabs, so the tab bar is hidden: go back to the Shop first.
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      # The native back button has no testID and its label is the previous screen's title, so match the likely labels.
      - tapOn:
          text: '(?i)(back|shop|\(tabs\))'
- extendedWaitUntil:
    visible:
      id: shop-cart
    timeout: 10000
# The Cart refetches on focus; the card animates in, so wait for it.
- tapOn:
    id: shop-cart
- extendedWaitUntil:
    visible:
      id: cart-list
    timeout: 15000
# The sticky bar is outside the list: always visible, with an enabled Checkout while the bag is clean.
- assertVisible:
    id: cart-bar
- assertVisible:
    id: cart-subtotal
- assertVisible:
    id: cart-checkout
    enabled: true
- tapOn:
    id: 'cart-open-.+'
- extendedWaitUntil:
    visible:
      id: product-name
    timeout: 15000
- assertVisible:
    id: product-add-to-cart
- assertVisible:
    id: product-bar
