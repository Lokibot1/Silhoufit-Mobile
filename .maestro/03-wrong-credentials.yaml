# Wrong password and unknown email must show the same copy (no user enumeration).
# The copy is identical, so the second check cannot tell a stale banner from a new one; it proves the copy, not the request.
appId: ${APP_ID}
env:
  WRONG_PASSWORD: Wrong-Password-1!
  UNKNOWN_EMAIL: nobody-e2e-unknown@example.com
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-sign-in
# Known email, wrong password
- tapOn:
    id: sign-in-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${WRONG_PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: sign-in-banner
    timeout: 15000
- assertVisible: Email or password is incorrect. Check both and try again.
# Unknown email, any password
- tapOn:
    id: sign-in-email
- eraseText: 100
- inputText: ${UNKNOWN_EMAIL}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: sign-in-banner
    timeout: 15000
- assertVisible: Email or password is incorrect. Check both and try again.
# Still on the sign-in screen, not signed in
- assertNotVisible:
    id: profile-name
