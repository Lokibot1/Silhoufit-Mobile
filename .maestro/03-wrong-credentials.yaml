# Wrong password and unknown email must show the same copy (no user enumeration).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn:
    id: shop-sign-in
# Known email, wrong password
- tapOn:
    id: sign-in-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${WRONG_PASSWORD || 'Wrong-Password-1!'}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: sign-in-banner
    timeout: 15000
- assertVisible: Email or password is incorrect.*
# Unknown email, any password
- tapOn:
    id: sign-in-email
- eraseText: 100
- inputText: ${UNKNOWN_EMAIL || 'nobody-e2e-unknown@example.com'}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: sign-in-banner
    timeout: 15000
- assertVisible: Email or password is incorrect. Check both and try again.
