appId: ${APP_ID}
---
# Signed out: the Cart prompt opens Sign In; signing in closes the modal (router.back()) and lands on the Cart tab, not Profile or Shop.
# Read-only on the cart. Needs a seeded customer.
- runFlow: subflows/launch.yaml
- tapOn:
    id: tab-cart
- extendedWaitUntil:
    visible:
      id: cart-sign-in
    timeout: 10000
- tapOn:
    id: cart-sign-in
- extendedWaitUntil:
    visible:
      id: sign-in-submit
    timeout: 10000
- tapOn:
    id: sign-in-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
# Back on the Cart tab with the account's bag (rows or the empty state).
- extendedWaitUntil:
    visible:
      id: 'cart-list|cart-empty-action'
    timeout: 20000
- assertNotVisible:
    id: sign-in-submit
- assertNotVisible:
    id: cart-sign-in
- assertNotVisible:
    id: profile-name
