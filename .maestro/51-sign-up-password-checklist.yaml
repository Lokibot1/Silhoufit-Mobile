appId: ${APP_ID}
---
# Sign up, signed out: names are sanitized as you type, and the password checklist updates live. The checklist is one
# accessibility element whose label lists each rule as "met" or "not met", so the asserts match that label text.
# Needs no backend and no account.
- runFlow: subflows/open-sign-up.yaml
- tapOn:
    id: sign-up-first-name
- inputText: J0hn
- assertVisible: Jhn
- assertNotVisible: J0hn
- hideKeyboard
- scrollUntilVisible:
    element:
      id: sign-up-password
- tapOn:
    id: sign-up-password
- inputText: abc
- assertVisible: '.*One lowercase letter, met.*'
- assertVisible: '.*At least 8 characters, not met.*'
- assertVisible: '.*One uppercase letter, not met.*'
- assertVisible: '.*One number, not met.*'
- assertVisible: '.*One special character, not met.*'
- eraseText: 3
- inputText: Abcdef1!
- assertNotVisible: '.*not met.*'
- hideKeyboard
# A confirm that differs shows the message once the field is left.
- scrollUntilVisible:
    element:
      id: sign-up-confirm
- tapOn:
    id: sign-up-confirm
- inputText: Abcdef1
- hideKeyboard
- tapOn:
    id: sign-up-password
- assertVisible: Passwords don't match.
