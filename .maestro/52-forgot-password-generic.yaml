appId: ${APP_ID}
---
# Forgot password: an address with no account gets the same generic confirmation as any other (no user enumeration).
# Uses a throwaway .invalid address (never deliverable), so no real email is sent. Needs only the backend.
- runFlow: subflows/launch.yaml
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-sign-in
- extendedWaitUntil:
    visible:
      id: sign-in-forgot
    timeout: 10000
- tapOn:
    id: sign-in-forgot
- extendedWaitUntil:
    visible:
      id: forgot-submit
    timeout: 10000
- evalScript: ${output.email = 'unknown-' + Date.now() + '@example.invalid'}
- tapOn:
    id: forgot-email
- inputText: ${output.email}
- hideKeyboard
- tapOn:
    id: forgot-submit
- extendedWaitUntil:
    visible:
      id: forgot-sent
    timeout: 15000
- assertVisible: If an account exists for that address, we sent a link to reset your password. The link expires in 30 minutes.
- assertNotVisible:
    id: forgot-error
# Back to Sign In
- tapOn:
    id: forgot-back
- extendedWaitUntil:
    visible:
      id: sign-in-submit
    timeout: 10000
