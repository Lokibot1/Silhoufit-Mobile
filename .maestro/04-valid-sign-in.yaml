appId: ${APP_ID}
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-sign-in
# The sign-in screen slides up: wait for it to settle before typing
- extendedWaitUntil:
    visible:
      id: sign-in-submit
    timeout: 10000
- tapOn:
    id: sign-in-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: profile-name
    timeout: 15000
# The sign-in modal slides down: wait for it to leave
- extendedWaitUntil:
    notVisible:
      id: sign-in-submit
    timeout: 10000
# Toast auto-dismisses after 4.5 s, so assert it right away
- assertVisible:
    id: toast
- assertVisible: Signed in as ${TEST_EMAIL}
