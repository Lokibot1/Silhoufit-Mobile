appId: ${APP_ID}
---
# Signed out: Add to Cart opens Sign In; signing in returns to the SAME product (the sign-in modal closes with router.back())
# and Add to Cart then works without picking again. Needs a seeded customer and an in-stock product.
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: 'shop-card-(?!.*-image$).+'
    timeout: 15000
- tapOn:
    id: 'shop-card-(?!.*-image$).+'
- extendedWaitUntil:
    visible:
      id: product-name
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'product-swatch-.+'
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    id: 'product-swatch-.+'
    enabled: true
    optional: true
- scrollUntilVisible:
    element:
      id: 'product-size-.+'
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    id: 'product-size-.+'
    enabled: true
    optional: true
- tapOn:
    id: product-add-to-cart
- extendedWaitUntil:
    visible:
      id: sign-in-submit
    timeout: 10000
- tapOn:
    id: sign-in-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
# Back on the product, not the Shop or Profile. The product stays mounted under the modal, so wait for the modal to slide away first.
- extendedWaitUntil:
    notVisible:
      id: sign-in-submit
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: product-name
    timeout: 15000
- assertNotVisible:
    id: sign-in-submit
- assertVisible:
    id: product-gallery
# The earlier selection is kept (the screen stayed mounted under the modal), so Add to Cart (sticky bar) works straight away.
- tapOn:
    id: product-add-to-cart
- extendedWaitUntil:
    visible: Added to cart
    timeout: 10000
