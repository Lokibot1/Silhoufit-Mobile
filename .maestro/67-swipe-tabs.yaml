appId: ${APP_ID}
---
# Swipe between tabs, UNRUN. Signs in, then drags from mid-screen over the product grid / lists: finger moving left goes Shop -> Cart -> Orders,
# finger moving right comes back to Shop. Swipes start at 85%/15% of the width, below the chip rows, so no sideways scroller is hit.
# Needs TEST_EMAIL and TEST_PASSWORD.
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- tapOn:
    id: tab-shop
- swipe:
    start: 85%, 60%
    end: 15%, 60%
- swipe:
    start: 85%, 60%
    end: 15%, 60%
- swipe:
    start: 15%, 60%
    end: 85%, 60%
- swipe:
    start: 15%, 60%
    end: 85%, 60%
- extendedWaitUntil:
    visible:
      id: tab-shop
    timeout: 5000
