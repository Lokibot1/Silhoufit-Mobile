appId: ${APP_ID}
---
# Swipe between tabs, UNRUN. Signs in, then swipes left from the right screen edge Shop -> Cart -> Orders and back right to Shop.
# Swipes start inside the 24dp edge strips (about 6% of the width, kept narrow so the Android back gesture is not hit); a swipe from the middle does nothing by design.
# Needs TEST_EMAIL and TEST_PASSWORD.
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- tapOn:
    id: tab-shop
- swipe:
    start: 97%, 50%
    end: 20%, 50%
- extendedWaitUntil:
    visible:
      id: tab-cart
    timeout: 5000
- swipe:
    start: 97%, 50%
    end: 20%, 50%
- swipe:
    start: 3%, 50%
    end: 80%, 50%
- swipe:
    start: 3%, 50%
    end: 80%, 50%
- extendedWaitUntil:
    visible:
      id: tab-shop
    timeout: 5000
