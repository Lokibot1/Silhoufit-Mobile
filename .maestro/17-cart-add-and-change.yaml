appId: ${APP_ID}
---
# Needs a seeded customer and an in-stock product (first Shop card) with stock of at least 3.
# This flow changes the REAL cart of TEST_EMAIL: use a dedicated test account. Repeatable: it empties the bag through the UI first
# and ends with an empty bag. If a run dies midway one piece stays in the bag and the next run clears it.
# The backend counts the cart against stock, so a 400 on the increment means the product has too little stock.
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- tapOn:
    id: tab-cart
- extendedWaitUntil:
    visible:
      id: 'cart-list|cart-empty-action'
    timeout: 15000
# Empty the bag first (only when it has rows). Clear Cart sits in the list footer, so scroll to it.
- runFlow:
    when:
      visible:
        id: cart-list
    commands:
      - scrollUntilVisible:
          element:
            id: cart-clear
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: cart-clear
      - runFlow:
          file: subflows/confirm-alert.yaml
          env:
            BUTTON: '(?i)Clear All Items'
      - extendedWaitUntil:
          visible:
            id: cart-empty-action
          timeout: 10000
- assertNotVisible:
    id: 'cart-row-(?!error-).+'
# Add exactly one piece, same steps as flow 13.
- tapOn:
    id: tab-shop
- extendedWaitUntil:
    visible:
      id: 'shop-card-(?!.*-image$).+'
    timeout: 15000
- tapOn:
    id: 'shop-card-(?!.*-image$).+'
- extendedWaitUntil:
    visible:
      id: product-name
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'product-swatch-.+'
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    id: 'product-swatch-.+'
    enabled: true
    optional: true
- scrollUntilVisible:
    element:
      id: 'product-size-.+'
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    id: 'product-size-.+'
    enabled: true
    optional: true
- tapOn:
    id: product-add-to-cart
- extendedWaitUntil:
    visible: Added to cart
    timeout: 10000
# The product page is a root Stack screen above the tabs, so the tab bar is hidden: go back to the Shop first.
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      # The native back button has no testID and its label is the previous screen's title, so match the likely labels.
      - tapOn:
          text: '(?i)(back|shop|\(tabs\))'
- extendedWaitUntil:
    visible:
      id: tab-cart
    timeout: 10000
# The Cart tab refetches on focus, so the new row shows without a manual refresh.
- tapOn:
    id: tab-cart
- extendedWaitUntil:
    visible:
      id: cart-list
    timeout: 15000
- assertVisible:
    id: 'cart-row-(?!error-).+'
- assertVisible:
    id: cart-count
    text: '(?i)1 Item'
# The quantity Text has accessibilityLabel "Quantity N": Android matches the text "N", iOS the label, so accept both.
- assertVisible:
    id: 'cart-qty-.+'
    text: '(Quantity )?1'
- assertVisible:
    id: cart-subtotal
# No checkout exists yet: the sticky bar says so and the button stays disabled.
- assertVisible:
    id: cart-checkout
    enabled: false
- assertVisible: Checkout is coming soon
- copyTextFrom:
    id: cart-subtotal
- tapOn:
    id: 'cart-inc-.+'
- extendedWaitUntil:
    visible:
      id: 'cart-qty-.+'
      text: '(Quantity )?2'
    timeout: 10000
- assertVisible:
    id: cart-count
    text: '(?i)2 Items'
- assertNotVisible:
    id: cart-subtotal
    text: ${maestro.copiedText}
- tapOn:
    id: 'cart-dec-.+'
- extendedWaitUntil:
    visible:
      id: 'cart-qty-.+'
      text: '(Quantity )?1'
    timeout: 10000
- assertVisible:
    id: cart-subtotal
    text: ${maestro.copiedText}
# Remove asks first. Cancel keeps the row.
- tapOn:
    id: 'cart-remove-.+'
- runFlow:
    file: subflows/confirm-alert.yaml
    env:
      BUTTON: '(?i)Cancel'
- extendedWaitUntil:
    notVisible: '(?i)Are you sure\?'
    timeout: 5000
- assertVisible:
    id: cart-list
- assertVisible:
    id: 'cart-row-(?!error-).+'
# Remove Item empties the bag.
- tapOn:
    id: 'cart-remove-.+'
- runFlow:
    file: subflows/confirm-alert.yaml
    env:
      BUTTON: '(?i)Remove Item'
- extendedWaitUntil:
    visible:
      id: cart-empty-action
    timeout: 10000
- assertVisible: Your cart is empty
- assertNotVisible:
    id: cart-list
# The empty state's action lands on the Shop tab.
- tapOn:
    id: cart-empty-action
- extendedWaitUntil:
    visible:
      id: shop-list
    timeout: 15000
