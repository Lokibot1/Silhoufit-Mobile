appId: ${APP_ID}
---
# Needs TEST_EMAIL/TEST_PASSWORD. The account should have a server notification that names an order (otherwise the empty
# state shows and the flow only asserts that). Opening a row marks that notification read on the server (one unread -> read).
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- tapOn:
    id: tab-notifications
- extendedWaitUntil:
    visible:
      id: 'notifications-list|notifications-empty-action'
    timeout: 20000
- assertNotVisible:
    id: notifications-sign-in
- runFlow:
    when:
      visible:
        id: notifications-empty-action
    commands:
      # The empty state renders inside the list, so only the rows prove there is none.
      - assertVisible: No notifications yet
      - assertNotVisible:
          id: 'notification-row-.+'
- runFlow:
    when:
      visible:
        id: 'notification-row-.+'
    commands:
      - assertVisible:
          id: 'notification-row-.+'
      - tapOn:
          id: 'notification-row-.+'
      # The order detail slides in above the tabs.
      - extendedWaitUntil:
          visible:
            id: order-detail
          timeout: 15000
      - assertVisible:
          id: order-status
      - runFlow:
          when:
            platform: Android
          commands:
            - back
      - runFlow:
          when:
            platform: iOS
          commands:
            # Same pattern as flow 21: the native back label is the previous title.
            - tapOn:
                text: '(?i)(back|alerts|\(tabs\))'
      - extendedWaitUntil:
          visible:
            id: notifications-list
          timeout: 10000
      - assertNotVisible:
          id: order-detail
