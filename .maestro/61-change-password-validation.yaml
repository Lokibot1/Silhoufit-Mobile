appId: ${APP_ID}
---
# Change Password, validation only, UNRUN. Signs in, opens Profile -> Edit Profile -> Change Password and submits the empty form: the field
# errors show and nothing is sent. A weak new password keeps the checklist unmet. It NEVER fills a valid trio and never reaches the
# server, so the password is not changed. A Google-only account sees "No password to change" instead (the flow accepts either).
# Needs TEST_EMAIL and TEST_PASSWORD.
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- tapOn:
    id: profile-menu-edit
- extendedWaitUntil:
    visible:
      id: edit-save
    timeout: 10000
- scrollUntilVisible:
    element:
      id: edit-change-password
    direction: DOWN
    timeout: 10000
- tapOn:
    id: edit-change-password
- extendedWaitUntil:
    visible:
      id: '(password-submit|password-google)'
    timeout: 10000
- runFlow:
    when:
      visible:
        id: password-submit
    commands:
      - tapOn:
          id: password-submit
      - assertVisible: Enter your current password.
      - tapOn:
          id: password-current
      - inputText: NotTheRealOne1!
      - tapOn:
          id: password-new
      - inputText: abc
      - hideKeyboard
      - assertVisible: Use at least 8 characters.
      - tapOn:
          id: password-confirm
      - inputText: xyz
      - hideKeyboard
      - tapOn:
          id: password-submit
      - assertVisible: Passwords don.t match.
- runFlow:
    when:
      visible:
        id: password-google
    commands:
      - assertVisible: You signed in with Google. Set a password via Forgot password.
