appId: ${APP_ID}
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-sign-in
# The sign-in screen slides up: wait for it to settle before typing
- extendedWaitUntil:
    visible:
      id: sign-in-submit
    timeout: 10000
- tapOn:
    id: sign-in-submit
- assertVisible: Email is required.
- assertVisible: Password is required.
