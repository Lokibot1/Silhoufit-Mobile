appId: ${APP_ID}
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- stopApp
- runFlow: subflows/relaunch.yaml
- tapOn:
    id: tab-profile
# The loader holds until the session is restored, so the signed-out prompt must never appear here.
- assertNotVisible:
    id: profile-sign-in
- extendedWaitUntil:
    visible:
      id: profile-name
    timeout: 15000
- assertNotVisible:
    id: profile-sign-in
