appId: ${APP_ID}
---
# The Shop header cart button (shop-cart) goes to the Cart tab. Signed out: the Cart's sign-in prompt, and no count badge.
# Needs only the backend.
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: shop-list
    timeout: 15000
- assertNotVisible:
    id: shop-cart-badge
- tapOn:
    id: shop-cart
- extendedWaitUntil:
    visible:
      id: cart-sign-in
    timeout: 10000
- assertVisible: Sign in to see your cart
- assertNotVisible:
    id: cart-list
- assertNotVisible:
    id: shop-list
