appId: ${APP_ID}
---
# Shop stays reachable and populated after signing in and after signing out.
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: shop-list
    timeout: 15000
- runFlow: subflows/sign-in.yaml
- tapOn:
    id: tab-shop
- extendedWaitUntil:
    visible:
      id: shop-list
    timeout: 15000
- assertVisible:
    id: 'shop-card-(?!.*-image$).+'
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element:
      id: profile-sign-out
    direction: DOWN
    timeout: 10000
- tapOn:
    id: profile-sign-out
- runFlow:
    file: subflows/confirm-alert.yaml
    env:
      BUTTON: '(?i)Sign Out'
- extendedWaitUntil:
    visible:
      id: profile-sign-in
    timeout: 10000
- tapOn:
    id: tab-shop
- extendedWaitUntil:
    visible:
      id: shop-list
    timeout: 15000
- assertVisible:
    id: 'shop-card-(?!.*-image$).+'
- assertNotVisible:
    id: sign-in-submit
