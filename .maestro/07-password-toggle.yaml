# Maestro cannot read secure-text content reliably, so we type a throwaway
# value (not the real password) and assert on whether it is rendered.
appId: ${APP_ID}
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-sign-in
# The sign-in screen slides up: wait for it to settle before typing
- extendedWaitUntil:
    visible:
      id: sign-in-submit
    timeout: 10000
- tapOn:
    id: sign-in-password
- inputText: Visible-Check-1
- assertVisible:
    text: Show password
- assertNotVisible: Visible-Check-1
- tapOn: Show password
- assertVisible: Hide password
- assertVisible: Visible-Check-1
- tapOn: Hide password
- assertVisible: Show password
- assertNotVisible: Visible-Check-1
