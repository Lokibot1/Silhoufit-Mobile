appId: ${APP_ID}
---
- runFlow: subflows/launch.yaml
# Signed-out cold start lands on the Shop (first tab), not on Profile or a sign-in screen
- extendedWaitUntil:
    visible:
      id: shop-search
    timeout: 15000
- assertNotVisible:
    id: profile-sign-in
- assertNotVisible:
    id: sign-in-submit
- tapOn:
    id: tab-profile
- extendedWaitUntil:
    visible:
      id: profile-sign-in
    timeout: 10000
- assertVisible: Sign in to see your profile
- assertNotVisible:
    id: profile-name
# No redirect to the sign-in screen
- assertNotVisible:
    id: sign-in-submit
