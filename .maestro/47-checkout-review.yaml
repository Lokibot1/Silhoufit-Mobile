appId: ${APP_ID}
---
# Read-only: opens the checkout review and NEVER taps Place Order (flow 49 is the one that creates an order).
# Needs TEST_EMAIL's account to have at least one piece in the cart and a default address with a map pin (the web can add one);
# the route is opened by deep link so the flow does not depend on the Cart's state.
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- openLink: silhoufitmobile://checkout
- extendedWaitUntil:
    visible:
      id: checkout-place-order
    timeout: 15000
# Each section loads on its own; wait for the last one (the shipping fee) before asserting.
- extendedWaitUntil:
    visible:
      id: checkout-shipping-fee
    timeout: 20000
- assertVisible:
    id: checkout-address
- assertVisible:
    id: checkout-address-change
- assertVisible:
    id: 'checkout-item-.+'
- assertVisible:
    id: checkout-courier
- assertVisible:
    id: checkout-bar-total
# The selected address has a map pin, a quote is loaded and the cart is clean, so Place Order is enabled and no hint explains a block.
- assertVisible:
    id: checkout-place-order
    enabled: true
- assertNotVisible:
    id: checkout-bar-hint
